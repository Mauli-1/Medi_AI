{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0 fw-bold">Chart of Accounts</h5>
  <a href="{{ url_for('accounting.index') }}" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form method="post" action="{{ url_for('accounting.new_account') }}" class="row g-2 align-items-end">
      <div class="col-auto"><label class="form-label small mb-0">Code</label><input name="code" class="form-control form-control-sm" style="width:100px" required></div>
      <div class="col-auto"><label class="form-label small mb-0">Name</label><input name="name" class="form-control form-control-sm" style="width:220px" required></div>
      <div class="col-auto">
        <label class="form-label small mb-0">Type</label>
        <select name="type" class="form-select form-select-sm" required>
          <option value="asset">Asset</option>
          <option value="liability">Liability</option>
          <option value="equity">Equity</option>
          <option value="revenue">Revenue</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="col-auto"><button class="btn btn-sm btn-accent">Add Account</button></div>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-sm table-hover mb-0">
      <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Type</th><th></th></tr></thead>
      <tbody>
        {% for a in accounts %}
        <tr>
          <td class="fw-semibold">{{ a.code }}</td>
          <td>{{ a.name }}</td>
          <td><span class="badge bg-light text-dark border">{{ a.type|capitalize }}</span></td>
          <td><a href="{{ url_for('accounting.ledger', account_id=a.id) }}" class="btn btn-sm btn-outline-primary py-0 px-2">View Ledger</a></td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No accounts yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
