{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0 fw-bold">ABHA QR Scan</h5>
  <a href="{{ url_for('abha.index') }}" class="btn btn-sm btn-outline-secondary">← Back</a>
</div>

<div class="alert alert-info small">
  Camera-based QR scanning requires device hardware access. As a fallback, scan the ABHA card QR
  using your phone's camera app and paste the extracted ABHA ID below.
</div>

<div class="card" style="max-width:480px">
  <div class="card-body">
    <label class="form-label small fw-semibold">Select Patient</label>
    <select id="qrPatient" class="form-select mb-3">
      <option value="">Select a patient...</option>
      {% for p in patients %}<option value="{{ p.id }}">{{ p.full_name }} — {{ p.phone or '' }}</option>{% endfor %}
    </select>
    <label class="form-label small fw-semibold">Scanned ABHA ID</label>
    <input type="text" id="qrAbhaId" class="form-control mb-3" placeholder="12-3456-7890-1234">
    <button class="btn btn-accent" onclick="goVerify()">Continue to Verify</button>
  </div>
</div>

<script>
function goVerify() {
  const pid = document.getElementById('qrPatient').value;
  if (!pid) { alert('Select a patient first.'); return; }
  window.location.href = `/abha/verify/${pid}`;
}
</script>
{% endblock %}
