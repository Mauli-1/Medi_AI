{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h5 class="mb-4 fw-bold">Barcode Manager</h5>

<div class="card mb-3">
  <div class="card-body py-2">
    <form method="get" class="d-flex gap-2">
      <input type="text" name="q" value="{{ q }}" placeholder="Search medicine..." class="form-control form-control-sm" style="max-width:300px">
      <button class="btn btn-sm btn-outline-secondary">Search</button>
    </form>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-sm table-hover mb-0">
      <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Barcode</th><th></th></tr></thead>
      <tbody>
        {% for m in medicines %}
        <tr>
          <td><span class="badge bg-light text-dark border">{{ m.medicine_code }}</span></td>
          <td>{{ m.name }}</td>
          <td class="small font-monospace">{{ m.barcode or '—' }}</td>
          <td class="d-flex gap-1">
            <form method="post" action="{{ url_for('barcode.generate', medicine_id=m.id) }}"><button class="btn btn-sm btn-outline-primary py-0 px-2">Generate</button></form>
            <a href="{{ url_for('barcode.medicine_batches', medicine_id=m.id) }}" class="btn btn-sm btn-outline-secondary py-0 px-2">Batches / Print Labels</a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No medicines found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
